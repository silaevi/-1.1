<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерком Wi‑Fi (локальный)</title>

    <!-- PWA: манифест и тема -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">

    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f2f5; color: #333; }
        .controls { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button {
            padding: 12px 20px; font-size: 16px; cursor: pointer;
            background: #007bff; color: white; border: none; border-radius: 6px; margin-bottom: 8px;
            width: 100%;
        }
        button:hover { background: #0056b3; }
        button.danger { background: #dc3545; }
        button.success { background: #28a745; }
        button.gray { background: #6c757d; }
        select, textarea { padding: 8px; margin: 8px 0; width: 100%; box-sizing: border-box; }
        textarea { font-size: 12px; height: 90px; resize: vertical; }
        #status { margin-top: 10px; font-weight: bold; }
        #deviceList { margin-top: 20px; }
        .device-item {
            display: flex; justify-content: space-between; align-items: center;
            background: white; padding: 10px; margin-bottom: 5px; border-radius: 6px;
            border-left: 4px solid #007bff;
        }
        .device-item button { width: auto; padding: 4px 10px; font-size: 12px; margin: 0; }
        .status-connected { color: #28a745; }
        .status-disconnected { color: #dc3545; }
        .hint { font-size: 13px; color: #555; }
    </style>
</head>
<body>

<div class="controls">
    <h2>Интерком (локальная сеть)</h2>
    <p class="hint">Микрофон включается автоматически. Разговор — без нажатия кнопок.
       Все телефоны должны быть в одной Wi‑Fi сети.</p>

    <label>Задержка паузы фоновой музыки (сек):</label>
    <select id="musicDelay">
        <option value="0">0 сек (мгновенно)</option>
        <option value="1">1 сек</option>
        <option value="2">2 сек</option>
        <option value="3">3 сек</option>
        <option value="4">4 сек</option>
    </select>

    <hr>
    <b>Подключение нового телефона:</b>

    <!-- Шаг 1: создать код-приглашение -->
    <button id="btnCreateOffer" class="success">1. Создать код подключения</button>

    <!-- Шаг 2: принять код собеседника и ответить -->
    <button id="btnAcceptOffer" class="gray">2. Вставить код собеседника и ответить</button>

    <!-- Шаг 3: завершить у того, кто создал -->
    <button id="btnAcceptAnswer" class="gray">3. Вставить ответ собеседника</button>

    <textarea id="signalArea" placeholder="Здесь появится код подключения (или вставь сюда код собеседника)"></textarea>
    <button id="btnCopy" class="gray">Скопировать код</button>

    <hr>
    <button id="micToggleBtn" class="success">Микрофон: ВКЛ</button>
    <button id="testAudioBtn">Проверка связи (эхо 3 сек)</button>

    <div id="status">Статус: Ожидание доступа к микрофону...</div>
</div>

<div id="deviceList">
    <h3>Подключённые устройства:</h3>
    <p id="noDevices">Нет подключённых устройств</p>
</div>

<!-- Скрытый элемент для воспроизведения входящего звука -->
<audio id="remoteAudio" autoplay></audio>

<script>
    // --- Переменные ---
    // Локальная сеть: STUN не нужен, работаем напрямую через Wi‑Fi
    let pc = new RTCPeerConnection({});
    let localStream;
    let micEnabled = true;
    let isInitiator = false;

    const statusDiv = document.getElementById('status');
    const micToggleBtn = document.getElementById('micToggleBtn');
    const testAudioBtn = document.getElementById('testAudioBtn');
    const musicDelaySelect = document.getElementById('musicDelay');
    const deviceList = document.getElementById('deviceList');
    const noDevices = document.getElementById('noDevices');
    const remoteAudio = document.getElementById('remoteAudio');
    const signalArea = document.getElementById('signalArea');

    let musicPauseTimer;

    // --- Ожидание сбора ICE-кандидатов (нужно перед показом кода) ---
    function waitIceComplete() {
        return new Promise(resolve => {
            if (pc.iceGatheringState === 'complete') { resolve(); return; }
            pc.addEventListener('icegatheringstatechange', () => {
                if (pc.iceGatheringState === 'complete') resolve();
            });
            // Подстраховка: не ждём дольше 5 секунд
            setTimeout(resolve, 5000);
        });
    }

    // --- Инициализация микрофона ---
    async function init() {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({
                audio: {
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true
                }
            });

            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            statusDiv.textContent = "Статус: Микрофон активен. Ожидание подключения...";
            statusDiv.className = "status-connected";
        } catch (err) {
            statusDiv.textContent = "Ошибка: Нет доступа к микрофону!";
            statusDiv.className = "status-disconnected";
            alert("Нужен доступ к микрофону. Обнови страницу и разреши микрофон.");
        }
    }

    // --- События соединения ---
    function setupPeerConnectionEvents() {
        pc.ontrack = event => {
            if (event.track.kind !== 'audio') return;
            remoteAudio.srcObject = event.streams[0];
            remoteAudio.play().catch(e =>
                console.log("Автовоспроизведение заблокировано — сделай один тап по экрану")
            );
            updateDeviceList("Собеседник подключён");
            statusDiv.textContent = "Статус: Связь установлена. Говорите без кнопок.";
            statusDiv.className = "status-connected";
        };

        pc.oniceconnectionstatechange = () => {
            const state = pc.iceConnectionState;
            if (state === 'disconnected' || state === 'failed') {
                statusDiv.textContent = "Статус: Связь потеряна. Проверьте Wi‑Fi.";
                statusDiv.className = "status-disconnected";
            } else if (state === 'connected') {
                statusDiv.textContent = "Статус: Стабильное соединение.";
                statusDiv.className = "status-connected";
            }
        };
    }

    // --- Шаг 1: создать код-приглашение ---
    document.getElementById('btnCreateOffer').addEventListener('click', async () => {
        if (!localStream) { alert("Сначала дай доступ к микрофону"); return; }
        isInitiator = true;
        setupPeerConnectionEvents();

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        await waitIceComplete();

        signalArea.value = btoa(JSON.stringify(pc.localDescription));
        statusDiv.textContent = "Статус: Код готов. Отправь его собеседнику (шаг 2 у него).";
    });

    // --- Шаг 2: принять код-приглашение и создать ответ ---
    document.getElementById('btnAcceptOffer').addEventListener('click', async () => {
        if (!localStream) { alert("Сначала дай доступ к микрофону"); return; }
        try {
            setupPeerConnectionEvents();

            const offer = JSON.parse(atob(signalArea.value.trim()));
            await pc.setRemoteDescription(new RTCSessionDescription(offer));

            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            await waitIceComplete();

            signalArea.value = btoa(JSON.stringify(pc.localDescription));
            statusDiv.textContent = "Статус: Ответ готов. Отправь его обратно (шаг 3 у собеседника).";
        } catch (e) {
            alert("Не удалось прочитать код. Убедись, что вставлен код из шага 1.");
        }
    });

    // --- Шаг 3: у создателя — вставить ответ ---
    document.getElementById('btnAcceptAnswer').addEventListener('click', async () => {
        try {
            const answer = JSON.parse(atob(signalArea.value.trim()));
            await pc.setRemoteDescription(new RTCSessionDescription(answer));
            statusDiv.textContent = "Статус: Соединяемся...";
        } catch (e) {
            alert("Не удалось прочитать код. Нужен код из шага 2 (ответ).");
        }
    });

    // --- Копирование кода ---
    document.getElementById('btnCopy').addEventListener('click', () => {
        signalArea.select();
        document.execCommand('copy');
        alert("Код скопирован. Отправь его собеседнику любым способом.");
    });

    // --- Логика паузы музыки (с задержкой) ---
    function pauseMusicWithDelay() {
        const delaySec = parseInt(musicDelaySelect.value);
        const delayMs = delaySec * 1000;

        clearTimeout(musicPauseTimer);

        if (delayMs === 0) { muteAudioInternal(); return; }

        musicPauseTimer = setTimeout(() => {
            if (micEnabled) muteAudioInternal();
        }, delayMs);
    }

    function resumeMusic() {
        clearTimeout(musicPauseTimer);
        unmuteAudioInternal();
    }

    function muteAudioInternal() {
        console.log("Симуляция паузы музыки (задержка применена)");
        statusDiv.textContent = "Музыка на паузе...";
    }

    function unmuteAudioInternal() {
        console.log("Возобновление музыки");
        statusDiv.textContent = "Статус: Ожидание...";
    }

    // --- Управление интерфейсом ---
    micToggleBtn.addEventListener('click', () => {
        micEnabled = !micEnabled;
        localStream.getTracks().forEach(t => t.enabled = micEnabled);

        if (micEnabled) {
            micToggleBtn.textContent = "Микрофон: ВКЛ";
            micToggleBtn.className = "success";
            resumeMusic();
        } else {
            micToggleBtn.textContent = "Микрофон: ВЫКЛ";
            micToggleBtn.className = "danger";
            pauseMusicWithDelay();
        }
    });

    testAudioBtn.addEventListener('click', () => {
        const testAudio = new Audio();
        testAudio.srcObject = localStream;
        testAudio.play();
        setTimeout(() => testAudio.pause(), 3000);
        alert("Ты слышишь себя 3 секунды — это проверка микрофона.");
    });

    // --- Список устройств ---
    function updateDeviceList(deviceName) {
        if (noDevices) noDevices.style.display = 'none';

        const item = document.createElement('div');
        item.className = 'device-item';
        item.innerHTML = `
            <span>${deviceName}</span>
            <button onclick="this.parentElement.remove(); if(document.querySelectorAll('.device-item').length===0) document.getElementById('noDevices').style.display='block'"
                    class="danger">Удалить</button>
        `;
        deviceList.appendChild(item);
    }

    // Запуск при загрузке страницы
    init();
</script>

<!-- PWA: регистрация service worker -->
<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }
</script>
</body>
</html>
